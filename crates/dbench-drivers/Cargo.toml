[package]
name = "dbench-drivers"
publish = false
description = "Database driver implementations for DBench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["dep:tokio-postgres", "dep:postgres-types", "dep:postgres-native-tls", "dep:native-tls"]
mysql = ["dep:sqlx"]
sqlite = ["dep:rusqlite"]
mongodb = ["dep:mongodb", "dep:futures-util"]
redis = ["dep:redis"]
clickhouse = ["dep:reqwest"]
cassandra = ["dep:scylla"]
mssql = ["dep:tiberius", "dep:tokio-util", "dep:futures-util"]
elasticsearch = ["dep:reqwest"]
surrealdb = ["dep:reqwest"]
oracle = ["dep:oracle"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "dep:reqwest"]
all = ["postgres", "mysql", "sqlite", "mongodb", "redis", "clickhouse", "cassandra", "mssql", "elasticsearch", "surrealdb", "oracle", "dynamodb"]

[dependencies]
dbench-core = { workspace = true }
dbench-security = { workspace = true }
dbench-macros = { path = "../dbench-macros" }

tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }
postgres-types = { version = "0.2", features = ["derive"], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "column_decltype"], optional = true }

# MySQL (sqlx mysql feature only — no sqlite conflict)
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"], optional = true }

# MongoDB
mongodb = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }

# ClickHouse (HTTP interface)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

# SQL Server / Azure SQL (TDS, rustls)
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

# Oracle (ODPI-C; Instant Client is loaded at runtime, not needed to build)
oracle = { version = "0.6", features = ["chrono"], optional = true }

# DynamoDB (official AWS SDK)
# Default features include a legacy hyper 0.14 / rustls 0.21 client (vulnerable h2 &
# rustls-webpki); use only the modern `default-https-client`.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso", "default-https-client"], optional = true }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"], optional = true }

# Cassandra / ScyllaDB (native CQL protocol)
scylla = { version = "0.13", optional = true }
