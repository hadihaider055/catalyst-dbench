[package]
name = "dbench-macros"
publish = false
description = "Procedural macros for DBench — reduces driver boilerplate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"    # Attribute parsing for derive macros

[dev-dependencies]
dbench-core = { workspace = true }
serde = { workspace = true }
