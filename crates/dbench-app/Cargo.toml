[package]
name = "dbench-app"
publish = false
description = "Tauri v2 desktop application backend for Catalyst DBench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dbench"
path = "src/main.rs"

[dependencies]
dbench-core = { workspace = true }
dbench-security = { workspace = true }
dbench-engine = { path = "../dbench-engine" }
dbench-drivers = { path = "../dbench-drivers", features = ["all"] }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"      # Persistent key-value store for UI prefs

tokio = { workspace = true }
tokio-util = "0.7"
dashmap = "5"
serde = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
