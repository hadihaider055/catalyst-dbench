# cargo-deny configuration (v2 schema). Run locally: `cargo deny --workspace check`

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we depend on directly; transitive ones are tracked upstream.
unmaintained = "workspace"
ignore = [
  # rsa "Marvin" timing attack: no fixed release exists. Pulled in by sqlx-mysql, which
  # only *encrypts* the password with the server's public key (caching_sha2 auth over
  # non-TLS); the attack needs an oracle on private-key *decryption*, which we never do.
  { id = "RUSTSEC-2023-0071", reason = "client-side RSA encryption only; no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "CC0-1.0",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MPL-2.0",
  "UPL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
